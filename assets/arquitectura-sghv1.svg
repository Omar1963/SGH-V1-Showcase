<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Arquitectura de gobierno operativo de SGH-V1</title>
<desc id="d">El Cerebro del sistema, Gestión de Trámites y Requisitos, define jurisdicciones, plantillas de requisitos y el catálogo de servicios, y provee a cada nivel: fichas de Empresa (9 solapas) y Personal (5 solapas); mesa de entradas con Doble Llave; expediente padre con áreas técnicas y candado forense; cierre comercial y facturación ARCA. V.I.G.I.A. supervisa todos los niveles.</desc>
