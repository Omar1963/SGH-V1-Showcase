<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="t d" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">El Cerebro de SGH-V1 por dentro: Gestión de Trámites y Requisitos</title>
<desc id="d">Configuración en tres niveles anidados: jurisdicción; plantilla de trámite con su ficha comercial (código, precio base y costo); y requisitos, cada uno con sector responsable (Habilitaciones, PsyMed o Trámites especiales) y su configuración. Alimenta la ficha de Empresa (checklist y servicios habilitados por jurisdicción), la mesa de entradas (expediente automático y sub-trámites por sector) y la gestión comercial (facturación del expediente padre con el precio del catálogo).</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#060912"/></linearGradient>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
<linearGradient id="msg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e1b4b"/><stop offset="0.5" stop-color="#312e81"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<filter id="glow" x="-5%" y="-10%" width="110%" height="120%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#818cf8" flood-opacity="0.45"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.6" opacity="0.5"/></pattern>
</defs>
